<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths - Test Excellentia</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 1.5rem;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .question-box {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: var(--text);
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        .correct { background-color: rgba(34, 197, 94, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .incorrect { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .stats {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Maths - Excellentia</h1>
    <div class="subtitle">Entraînement actif - Saisis ta réponse</div>

    <div id="quiz-container">
        <div class="question-box" id="question-text">Chargement de la question...</div>
        <input type="text" id="user-answer" placeholder="Écris ta réponse ici..." autocomplete="off">
        <button id="submit-btn" onclick="checkAnswer()">Valider la réponse</button>
        <div id="feedback" class="feedback"></div>
    </div>

    <div class="stats">
        <span id="progress">Question 1 / 5</span>
        <span id="score">Score : 0</span>
    </div>
</div>

<script>
    const questions = [
        { q: "Quel est l'ensemble de définition de la fonction f(x) = 1 / (x - 3) ? (Écris sous la forme x != nombre ou R \\ {nombre})", a: "x != 3" },
        { q: "Calcule la dérivée de f(x) = 3x^2 + 5x - 2", a: "6x + 5" },
        { q: "Quelle est la limite de (1/x) quand x tend vers l'infini (+inf) ?", a: "0" },
        { q: "Factorise l'identité remarquable : x^2 - 9", a: "(x-3)(x+3)" },
        { q: "Résous l'équation simple : 2x + 4 = 10", a: "3" }
    ];

    let currentIdx = 0;
    let score = 0;

    function loadQuestion() {
        if (currentIdx < questions.length) {
            document.getElementById('question-text').innerText = `Q${currentIdx + 1}: ${questions[currentIdx].q}`;
            document.getElementById('user-answer').value = '';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('user-answer').disabled = false;
            document.getElementById('submit-btn').innerText = "Valider la réponse";
            document.getElementById('submit-btn').setAttribute("onclick", "checkAnswer()");
            document.getElementById('progress').innerText = `Question ${currentIdx + 1} / ${questions.length}`;
        } else {
            document.getElementById('quiz-container').innerHTML = `
                <h2 style="text-align:center; color: #22c55e;">Quiz terminé ! 🎉</h2>
                <p style="text-align:center; font-size: 1.2rem;">Ton score final est de ${score} / ${questions.length}</p>
                <button onclick="location.reload()">Recommencer</button>
            `;
        }
    }

    function checkAnswer() {
        const userIn = document.getElementById('user-answer').value.trim().replace(/\s+/g, '');
        const correctIn = questions[currentIdx].a.replace(/\s+/g, '');
        const feedback = document.getElementById('feedback');

        if (userIn === "") return;

        feedback.style.display = 'block';
        if (userIn.toLowerCase() === correctIn.toLowerCase()) {
            feedback.className = "feedback correct";
            feedback.innerText = "Correct ! Excellent travail.";
            score++;
        } else {
            feedback.className = "feedback incorrect";
            feedback.innerText = `Incorrect. La bonne réponse attendue était : ${questions[currentIdx].a}`;
        }

        document.getElementById('score').innerText = `Score : ${score}`;
        document.getElementById('user-answer').disabled = true;
        document.getElementById('submit-btn').innerText = "Question suivante";
        document.getElementById('submit-btn').setAttribute("onclick", "nextQuestion()");
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    // Charger la première question au démarrage
    loadQuestion();
</script>

</body>
</html>
